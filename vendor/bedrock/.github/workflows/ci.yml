name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
      - run: alr -n build
      - run: |
          cd tests
          alr -n build
          ./bin/tests
      - name: SPARK flow analysis
        run: |
          alr -n with gnatprove
          alr -n exec -- gnatprove -P bedrock.gpr --mode=flow --checks-as-errors=on
